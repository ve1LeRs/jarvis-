name: Build JARVIS.exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Stamp build number
        shell: pwsh
        run: |
          Set-Content -Path jarvis/version.py -Encoding utf8 -Value @(
            '"""Build number. CI overwrites this file before building JARVIS.exe."""',
            '',
            "BUILD = ${{ github.run_number }}"
          )

      - name: Build JARVIS.exe
        run: pyinstaller --noconfirm jarvis.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-windows
          path: dist/JARVIS.exe

      # The app's auto-updater reads releases/latest and expects tag "build-<N>".
      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: JARVIS build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/JARVIS.exe
